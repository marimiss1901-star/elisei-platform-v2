databases:
  - name: elisei-db
    plan: free

envVarGroups:
  - name: elisei-api-secrets
    envVars:
      - key: JWT_SECRET
        generateValue: true
      # SMS.RU API key. Required for registration phone verification and password recovery.
      - key: SMS_RU_API_ID
        sync: false
      # Temporary bridge for the original ELISEI owner account created before phone verification existed.
      # Set these in Render to the legacy account email and the phone that should receive recovery SMS.
      - key: OWNER_RECOVERY_EMAIL
        sync: false
      - key: OWNER_RECOVERY_PHONE
        sync: false

services:
  - type: web
    name: elisei-api
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: FRONTEND_ORIGIN
        value: https://elisei-platform-v2.onrender.com
      - key: CONNECTION_TTL_HOURS
        value: 12
      # Keep the app inside the connection budget of the current PostgreSQL tier.
      # Heavy WB readers share one canonical hydration, so two clients are enough
      # for the foreground read model plus the background scheduler.
      - key: PG_POOL_MAX
        value: 2
      - key: PG_CONNECT_TIMEOUT_MS
        value: 6000
      - key: PG_IDLE_TIMEOUT_MS
        value: 20000
      - key: DATABASE_URL
        fromDatabase:
          name: elisei-db
          property: connectionString
      - fromGroup: elisei-api-secrets
