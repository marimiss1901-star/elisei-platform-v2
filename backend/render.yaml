databases:
  - name: elisei-db
    plan: free

envVarGroups:
  - name: elisei-api-secrets
    envVars:
      - key: JWT_SECRET
        generateValue: true

services:
  - type: web
    name: elisei-api
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: FRONTEND_ORIGIN
        value: https://elisei-platform-v2.onrender.com
      - key: CONNECTION_TTL_HOURS
        value: 12
      - key: DATABASE_URL
        fromDatabase:
          name: elisei-db
          property: connectionString
      - fromGroup: elisei-api-secrets
