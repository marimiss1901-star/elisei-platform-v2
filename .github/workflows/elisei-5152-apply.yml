name: Apply ELISEI 5.15.2 runtime-window fix

on:
  push:
    branches: [feat/runtime-window-clamp-5152]
    paths:
      - '.github/scripts/patch-5152.mjs'
      - '.github/workflows/elisei-5152-apply.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/runtime-window-clamp-5152
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node .github/scripts/patch-5152.mjs
      - name: Commit source patch
        run: |
          if git diff --quiet; then
            echo 'No source changes required.'
            exit 0
          fi
          git config user.name 'ELISEI Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add backend/src/server.js
          git commit -m 'ELISEI 5.15.2: fix runtime rate-window carryover'
          git push origin HEAD:feat/runtime-window-clamp-5152
