name: ELISEI 5.15 source patch

on:
  push:
    branches: [feat/group-parallel-scheduler-5150]
    paths:
      - '.github/workflows/elisei-5150-apply.yml'
      - '.github/scripts/patch-5150.mjs'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/group-parallel-scheduler-5150
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node .github/scripts/patch-5150.mjs
      - name: Commit source patch
        run: |
          if git diff --quiet; then
            echo 'No source patch required.'
            exit 0
          fi
          git config user.name 'ELISEI Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add backend/src/server.js
          git commit -m 'ELISEI 5.15.0: parallelize independent WB API groups'
          git push origin HEAD:feat/group-parallel-scheduler-5150
