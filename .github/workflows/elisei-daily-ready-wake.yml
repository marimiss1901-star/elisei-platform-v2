name: ELISEI Daily Ready wake

on:
  schedule:
    # GitHub cron is UTC. These runs target 01:30, 04:30 and 06:30 Moscow.
    - cron: '30 22 * * *'
    - cron: '30 1 * * *'
    - cron: '30 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  ELISEI_BACKEND_URL: ${{ secrets.ELISEI_BACKEND_URL || 'https://elisei-platform-v21.onrender.com' }}

jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Keep backend awake and explicitly start Daily Ready
        run: |
          set -euo pipefail
          echo "Starting ELISEI Nightly Ready and keeping backend awake for the worker"
          for attempt in 1 2 3 4 5 6; do
            echo "Nightly Ready wake ${attempt}/6"
            curl --fail --silent --show-error --retry 3 --retry-delay 5 --max-time 60 \
              "${ELISEI_BACKEND_URL%/}/health?wake=daily-ready"
            echo
            if [ "$attempt" != "6" ]; then sleep 75; fi
          done
