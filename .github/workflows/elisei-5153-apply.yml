name: Apply ELISEI 5.15.3 Nightly Ready

on:
  push:
    branches: [feat/nightly-ready-5153]
    paths:
      - '.github/scripts/patch-5153.mjs'
      - '.github/workflows/elisei-5153-apply.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/nightly-ready-5153
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node .github/scripts/patch-5153.mjs
      - name: Commit source patch
        run: |
          if git diff --quiet; then
            echo 'No source changes required.'
            exit 0
          fi
          git config user.name 'ELISEI Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add backend/src/server.js backend/src/wb/daily-ready.js
          git commit -m 'ELISEI 5.15.3: Nightly Ready and operational retry caps'
          git push origin HEAD:feat/nightly-ready-5153
