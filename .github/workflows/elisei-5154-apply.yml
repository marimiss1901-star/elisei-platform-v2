name: Apply ELISEI 5.15.4 P&L ledger patch

on:
  push:
    branches: [fix/pnl-ledger-source-5154]
    paths:
      - '.github/scripts/patch-5154.mjs'
      - '.github/workflows/elisei-5154-apply.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/pnl-ledger-source-5154
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node .github/scripts/patch-5154.mjs
      - name: Commit source patch
        run: |
          if git diff --quiet; then
            echo 'No source changes required.'
            exit 0
          fi
          git config user.name 'ELISEI Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add src/pages/DashboardPage.jsx
          git commit -m 'ELISEI 5.15.4: feed P&L from finance ledger'
          git push origin HEAD:fix/pnl-ledger-source-5154
