name: Apply ELISEI 5.15.6 finance ledger repair

on:
  push:
    branches: [fix/finance-ledger-5156]
    paths:
      - '.github/scripts/patch-finance-ledger-5156.mjs'
      - '.github/workflows/apply-finance-ledger-5156.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/finance-ledger-5156
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node .github/scripts/patch-finance-ledger-5156.mjs
      - name: Commit source patch
        run: |
          if git diff --quiet; then
            echo 'No source changes required.'
            exit 0
          fi
          git config user.name 'ELISEI Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add backend/src/wb/finance-ledger.js backend/src/server.js src/pages/DashboardPage.jsx package.json backend/package.json backend/tests
          git commit -m 'ELISEI 5.15.6: restore finance ledger and truthful P&L'
          git push origin HEAD:fix/finance-ledger-5156
