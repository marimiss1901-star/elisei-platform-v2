name: Validate ELISEI 5.15.0

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Frontend install
        run: npm install
      - name: Frontend build
        run: npm run build
      - name: Backend install
        working-directory: backend
        run: npm install
      - name: Backend regression suite
        working-directory: backend
        run: npm test
