name: Apply ELISEI 5.15.8 Nightly Ready

on:
  push:
    branches: [fix/nightly-ready-5158]
    paths:
      - '.github/scripts/patch-nightly-ready-5158.mjs'
      - '.github/workflows/apply-nightly-ready-5158.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/nightly-ready-5158
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node .github/scripts/patch-nightly-ready-5158.mjs
      - name: Commit source patch
        run: |
          if git diff --quiet; then
            echo 'No source changes required.'
            exit 0
          fi
          git config user.name 'ELISEI Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add backend/src/wb/daily-ready.js package.json backend/package.json backend/tests
          git commit -m 'ELISEI 5.15.8: extend Nightly Ready to stale secondary streams'
          git push origin HEAD:fix/nightly-ready-5158
