name: Apply ELISEI 5.15.1 cadence

on:
  push:
    branches: [feat/adaptive-live-cadence-5151]
    paths:
      - '.github/scripts/patch-5151.mjs'
      - '.github/workflows/elisei-5151-apply.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/adaptive-live-cadence-5151
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node .github/scripts/patch-5151.mjs
      - name: Commit source patch
        run: |
          if git diff --quiet; then
            echo 'No source changes required.'
            exit 0
          fi
          git config user.name 'ELISEI Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add backend/src/server.js backend/src/wb/daily-ready.js
          git commit -m 'ELISEI 5.15.1: apply adaptive live cadence policy'
          git push origin HEAD:feat/adaptive-live-cadence-5151
