name: Apply ELISEI display-name hotfix

on:
  push:
    branches: [fix/display-name-5155]
    paths:
      - '.github/scripts/patch-display-name.mjs'
      - '.github/workflows/apply-display-name-hotfix.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/display-name-5155
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node .github/scripts/patch-display-name.mjs
      - name: Commit source patch
        run: |
          if git diff --quiet; then
            echo 'No source changes required.'
            exit 0
          fi
          git config user.name 'ELISEI Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add src/pages/DashboardPage.jsx
          git commit -m 'Fix preferred display name on dashboard'
          git push origin HEAD:fix/display-name-5155
